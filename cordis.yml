# Example composition. In a real DeepSeek Harness deployment the storage,
# system-prompt, and tools entries already live in the host's cordis.yml —
# you add only the final `dsh-memory` entry to your own. The plugin registers
# its own storage backends (global + project), so no storage backend entry is
# required here.

- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: memory
  name: '@max-null/dsh-memory'
